<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GayatriFlix | Official Trailer</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@100;300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            color: #fff;
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
            user-select: none;
        }
        
        .trailer-container {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }
        
        /* Netflix UI Overlays */
        .top-bar {
            position: absolute;
            top: 0; left: 0; right: 0;
            padding: 30px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            transition: opacity 0.5s;
        }
        .back-btn {
            font-size: 2rem;
            color: #fff;
            cursor: pointer;
            text-decoration: none;
            line-height: 1;
            transition: 0.2s;
        }
        .back-btn:hover { color: #a3a3a3; }
        
        .rating {
            border: 1px solid rgba(255,255,255,0.4);
            padding: 4px 12px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #ccc;
            background: rgba(0,0,0,0.4);
        }
        
        .bottom-bar {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 40px;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 18px;
            transition: opacity 0.5s;
        }
        
        .title-block { margin-bottom: 5px; }
        .badge {
            color: #E50914;
            font-family: 'Bebas Neue';
            font-size: 1.4rem;
            letter-spacing: 2px;
            margin-bottom: 2px;
        }
        .title {
            font-family: 'Bebas Neue';
            font-size: 3.5rem;
            letter-spacing: 2px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
            line-height: 1;
        }
        
        .progress-container {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.25);
            cursor: pointer;
            border-radius: 3px;
            overflow: hidden;
            position: relative;
        }
        .progress-bar {
            height: 100%;
            background: #E50914;
            width: 0%;
            transition: width 0.1s linear;
        }
        
        .skip-btn {
            position: absolute;
            bottom: 140px; right: 40px;
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.5);
            color: #fff;
            padding: 12px 25px;
            font-family: 'Outfit';
            font-size: 1rem;
            font-weight: 500;
            border-radius: 4px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            z-index: 20;
            transition: 0.3s;
        }
        .skip-btn:hover { background: #fff; color: #000; border-color: #fff; }
        
        .controls-row {
            display: flex; align-items: center; gap: 20px;
        }
        .play-pause {
            background: none; border: none; color: #fff; font-size: 1.8rem; cursor: pointer; transition: 0.2s;
        }
        .play-pause:hover { transform: scale(1.1); }
        .time-display { font-size: 0.95rem; color: #ccc; font-variant-numeric: tabular-nums; }
        
        .fullscreen-btn { margin-left: auto; background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; transition: 0.2s; }
        .fullscreen-btn:hover { color: #a3a3a3; }

        /* The 'Click to play' overlay for autoplay policies */
        #overlay-start {
            position: absolute; inset: 0; z-index: 9999;
            background: rgba(0,0,0,0.85);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            backdrop-filter: blur(10px);
            cursor: pointer;
            transition: opacity 0.5s;
        }
        .vol-icon { font-size: 4rem; margin-bottom: 20px; color: #fff; }
        .vol-btn {
            padding: 15px 40px;
            background: #E50914;
            border: none;
            color: #fff;
            font-size: 1.2rem;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s;
        }
        .vol-btn:hover { background: #f40612; transform: scale(1.05); }
        
        /* Fade UI if inactive */
        .ui-hidden .top-bar, .ui-hidden .bottom-bar, .ui-hidden .skip-btn { opacity: 0; pointer-events: none; }
    </style>
</head>
<body>
    
    <div id="overlay-start" onclick="startTrailer()">
        <div class="vol-icon">🔊</div>
        <button class="vol-btn">Unmute & Play Trailer</button>
    </div>

    <div class="trailer-container" id="container">
        <!-- Using VIDEO 4.mp4 as the trailer -->
        <video id="trailer-video" src="VIDEO 4.mp4" playsinline preload="auto"></video>
        
        <div class="top-bar">
            <a href="pre_teaser.html" class="back-btn">&#8592;</a>
            <div class="rating">TV-19</div>
        </div>

        <button class="skip-btn" onclick="skipToMain()">Skip Trailer &#8250;</button>

        <div class="bottom-bar">
            <div class="title-block">
                <div class="badge">N ORIGINAL TRAILER</div>
                <div class="title">GAYATRI: SEASON 19</div>
            </div>
            
            <div class="progress-container" id="progressBarContainer" onclick="seek(event)">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            
            <div class="controls-row">
                <button class="play-pause" id="playBtn" onclick="togglePlay()">⏸</button>
                <div class="time-display" id="timeDisplay">0:00 / 0:00</div>
                <button class="fullscreen-btn" onclick="toggleFullScreen()">⛶</button>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('trailer-video');
        const progressBar = document.getElementById('progressBar');
        const playBtn = document.getElementById('playBtn');
        const timeDisplay = document.getElementById('timeDisplay');
        const startOverlay = document.getElementById('overlay-start');
        const container = document.getElementById('container');
        
        let hideUITimeout;

        function resetUITimer() {
            container.classList.remove('ui-hidden');
            clearTimeout(hideUITimeout);
            if (!video.paused) {
                hideUITimeout = setTimeout(() => {
                    container.classList.add('ui-hidden');
                }, 3000);
            }
        }
        
        document.addEventListener('mousemove', resetUITimer);
        document.addEventListener('click', resetUITimer);

        function startTrailer() {
            startOverlay.style.opacity = '0';
            setTimeout(() => { startOverlay.style.display = 'none'; }, 500);
            video.volume = 1;
            video.play();
            resetUITimer();
        }

        function togglePlay() {
            if(video.paused) { 
                video.play(); playBtn.innerText = '⏸'; 
                resetUITimer();
            } else { 
                video.pause(); playBtn.innerText = '▶'; 
                container.classList.remove('ui-hidden');
                clearTimeout(hideUITimeout);
            }
        }

        function formatTime(seconds) {
            if(isNaN(seconds)) return "0:00";
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return m + ':' + (s < 10 ? '0' : '') + s;
        }

        video.addEventListener('timeupdate', () => {
            if(!video.duration) return;
            const pct = (video.currentTime / video.duration) * 100;
            progressBar.style.width = pct + '%';
            timeDisplay.innerText = formatTime(video.currentTime) + ' / ' + formatTime(video.duration);
        });

        function seek(e) {
            const rect = document.getElementById('progressBarContainer').getBoundingClientRect();
            const pos = (e.clientX - rect.left) / rect.width;
            video.currentTime = pos * video.duration;
            if(video.paused) { video.play(); playBtn.innerText = '⏸'; }
        }

        video.addEventListener('ended', () => {
            skipToMain();
        });

        function skipToMain() {
            // Once trailer ends or skip is pressed, go to the main UI.
            // Setup a small session flag so we don't have to re-enter passcode on index?
            // Actually, for maximum effect, let index.html do its thing.
            window.location.href = 'index.html';
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                container.requestFullscreen().catch(err => {});
            } else {
                document.exitFullscreen();
            }
        }
    </script>
</body>
</html>
