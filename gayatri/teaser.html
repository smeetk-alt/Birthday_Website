<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAYATRI | Official Teaser</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@100;300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --netflix-red: #E50914;
            --bg-black: #080808;
            --text-white: #ffffff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: var(--bg-black); 
            color: var(--text-white); 
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
        }
        .teaser-video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.35;
            z-index: 1;
        }
        .vignette {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, #000 10%, transparent 50%),
                        linear-gradient(to right, #000 10%, transparent 50%);
            z-index: 2;
        }
        .content {
            position: relative;
            z-index: 10;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .netflix-logo {
            color: var(--netflix-red);
            font-family: 'Bebas Neue';
            font-size: 3rem;
            letter-spacing: 2px;
            margin-bottom: 20px;
            opacity: 0;
            animation: fadeIn 2s ease forwards 0.5s;
        }
        .title {
            font-family: 'Bebas Neue';
            font-size: clamp(4rem, 12vw, 10rem);
            line-height: 0.85;
            margin-bottom: 10px;
            text-shadow: 0 10px 40px rgba(0,0,0,0.8);
            opacity: 0;
            animation: slideUp 1.5s ease forwards 1s;
        }
        .subtitle {
            font-size: clamp(1rem, 2.5vw, 1.8rem);
            font-weight: 300;
            letter-spacing: 8px;
            text-transform: uppercase;
            color: #ccc;
            margin-bottom: 50px;
            opacity: 0;
            animation: slideUp 1.5s ease forwards 1.5s;
        }
        
        /* Countdown display */
        .countdown {
            display: flex;
            gap: 25px;
            margin-bottom: 40px;
            opacity: 0;
            animation: fadeIn 2s ease forwards 2s;
        }
        .cd-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .cd-num {
            font-family: 'Bebas Neue';
            font-size: 3.5rem;
            color: #E50914;
            line-height: 1;
            text-shadow: 0 2px 10px rgba(229, 9, 20, 0.4);
        }
        .cd-lbl {
            font-size: 0.8rem;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 5px;
        }

        .release-date {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 4px;
            margin-bottom: 40px;
            opacity: 0;
            animation: fadeIn 2s ease forwards 2.5s;
        }
        .btn-group {
            display: flex;
            gap: 20px;
            opacity: 0;
            animation: fadeIn 2s ease forwards 3s;
        }
        .btn {
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 4px;
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }
        .btn-wait { background: rgba(109, 109, 110, 0.5); color: #fff; backdrop-filter: blur(10px); }
        .btn-wait:hover { background: rgba(109, 109, 110, 0.8); transform: scale(1.05); }
        .btn-play { background: #fff; color: #000; }
        .btn-play:hover { background: rgba(255,255,255,0.7); transform: scale(1.05); }

        @keyframes fadeIn { to { opacity: 1; } }
        @keyframes slideUp { 
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <audio id="bgMusic" autoplay loop>
        <source src="../bensound-sweet.mp3" type="audio/mpeg">
    </audio>

    <video class="teaser-video" src="VIDEO 2.mp4" autoplay muted loop playsinline></video>
    <div class="vignette"></div>
    
    <div class="content">
        <div class="netflix-logo">GAYATRIFLIX</div>
        <h1 class="title">SEASON 19</h1>
        <div class="subtitle">The Legend Continues</div>

        <div class="countdown" id="countdown">
            <div class="cd-box"><span class="cd-num" id="d">00</span><span class="cd-lbl">Days</span></div>
            <div class="cd-box"><span class="cd-num" id="h">00</span><span class="cd-lbl">Hours</span></div>
            <div class="cd-box"><span class="cd-num" id="m">00</span><span class="cd-lbl">Mins</span></div>
            <div class="cd-box"><span class="cd-num" id="s">00</span><span class="cd-lbl">Secs</span></div>
        </div>

        <div class="release-date">PREMIERES APRIL 30, 2026</div>

        <div class="btn-group">
            <button class="btn btn-wait" onclick="alert('Reminder set! Get ready for the premiere.')">🔔 Remind Me</button>
            <button class="btn btn-play" onclick="window.location.href='index.html'">▶ Watch Premiere</button>
        </div>
    </div>

    <script>
        // Start background music slightly delayed so it fades in nicely
        const music = document.getElementById('bgMusic');
        music.volume = 0;
        music.play().catch(() => {});
        setTimeout(() => {
            let vol = 0;
            const fadeIn = setInterval(() => {
                if (vol < 0.4) { vol += 0.05; music.volume = vol; }
                else clearInterval(fadeIn);
            }, 200);
        }, 1000);

        // Countdown Timer
        const target = new Date('2026-04-30T00:00:00');
        function tick() {
            const diff = target - new Date();
            if(diff <= 0) {
                document.getElementById('d').innerText = '00';
                document.getElementById('h').innerText = '00';
                document.getElementById('m').innerText = '00';
                document.getElementById('s').innerText = '00';
                return;
            }
            document.getElementById('d').innerText = String(Math.floor(diff / 86400000)).padStart(2,'0');
            document.getElementById('h').innerText = String(Math.floor((diff % 86400000)/3600000)).padStart(2,'0');
            document.getElementById('m').innerText = String(Math.floor((diff % 3600000)/60000)).padStart(2,'0');
            document.getElementById('s').innerText = String(Math.floor((diff % 60000)/1000)).padStart(2,'0');
        }
        tick();
        setInterval(tick, 1000);
    </script>
</body>
</html>
