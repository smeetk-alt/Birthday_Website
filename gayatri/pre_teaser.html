<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GayatriFlix | A Global Launch Event</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@100;300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            color: #fff;
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        
        .n-logo {
            font-family: 'Bebas Neue';
            font-size: 8rem;
            color: #E50914;
            text-shadow: 0 0 50px rgba(229,9,20,0.6);
            margin-bottom: -10px;
        }
        
        /* Intro Animation Sweep */
        #color-sweep {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg,
                transparent 0%,
                rgba(255,80,30,0.35) 10%,
                rgba(255,200,50,0.25) 25%,
                rgba(80,255,140,0.2) 40%,
                rgba(60,140,255,0.25) 55%,
                rgba(160,60,255,0.2) 70%,
                rgba(255,60,120,0.3) 85%,
                transparent 100%
            );
            mix-blend-mode: screen;
            pointer-events: none;
            z-index: 1;
            opacity: 0;
            animation: sweepRun 2.5s ease 0.5s forwards;
        }
        @keyframes sweepRun {
            0%   { opacity:0; transform: translateY(120%); }
            25%  { opacity:1; }
            75%  { opacity:1; }
            100% { opacity:0; transform: translateY(-120%); }
        }

        .container {
            text-align: center;
            opacity: 0;
            animation: fadeIn 2s forwards 0.5s;
            position: relative;
            z-index: 10;
        }
        @keyframes fadeIn { to { opacity: 1; } }
        
        .subtitle {
            font-size: 0.8rem;
            letter-spacing: 6px;
            color: #a3a3a3;
            text-transform: uppercase;
            margin-bottom: 40px;
            margin-top: 20px;
        }
        .title {
            font-family: 'Bebas Neue';
            font-size: 4.5rem;
            margin-bottom: 20px;
            color: #fff;
            letter-spacing: 2px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }
        .date {
            font-size: 1.2rem;
            font-weight: 300;
            color: #E50914;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }
        .btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.4);
            color: #fff;
            padding: 14px 40px;
            font-family: 'Outfit';
            font-size: 1.05rem;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.3s;
            backdrop-filter: blur(5px);
        }
        .btn:hover {
            background: #fff;
            color: #000;
            border-color: #fff;
        }
        .bg-video {
            position: absolute;
            inset: 0;
            width: 100%; height: 100%;
            object-fit: contain;
            object-position: center;
            background: #000;
            opacity: 0.25;
            z-index: 1;
        }
        .vignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, transparent 20%, #000 85%);
            z-index: 2;
        }
    </style>
</head>
<body>
    <div id="color-sweep"></div>
    <video class="bg-video" src="VIDEO 2.mp4" autoplay loop muted playsinline></video>
    <div class="vignette"></div>

    <div class="container">
        <!-- SVG N Logo mimicking Netflix -->
        <svg width="100" height="268" viewBox="0 0 111 300" xmlns="http://www.w3.org/2000/svg" style="display:inline-block; filter: drop-shadow(0 0 40px rgba(229,9,20,0.6));">
            <defs>
                <linearGradient id="lG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a00610"/><stop offset="50%" stop-color="#e50914"/><stop offset="100%" stop-color="#a00610"/></linearGradient>
                <linearGradient id="rG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#8b050d"/><stop offset="50%" stop-color="#d40812"/><stop offset="100%" stop-color="#8b050d"/></linearGradient>
                <linearGradient id="dG" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#e50914"/><stop offset="25%" stop-color="#ff4444"/><stop offset="50%" stop-color="#c0070f"/><stop offset="75%" stop-color="#ff3030"/><stop offset="100%" stop-color="#e50914"/></linearGradient>
                <linearGradient id="gloss" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="rgba(255,255,255,0)" stop-opacity="0"/><stop offset="35%" stop-color="rgba(255,255,255,0.22)" stop-opacity="0.22"/><stop offset="100%" stop-color="rgba(255,255,255,0)" stop-opacity="0"/></linearGradient>
                <filter id="shadow"><feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.6"/></filter>
            </defs>
            <rect x="0" y="0" width="30" height="300" rx="2" fill="url(#lG)" filter="url(#shadow)"/>
            <rect x="5" y="0" width="8" height="300" rx="1" fill="rgba(255,255,255,0.09)"/>
            <polygon points="0,0 30,0 111,300 81,300" fill="url(#dG)" filter="url(#shadow)"/>
            <polygon points="10,0 22,0 103,300 91,300" fill="url(#gloss)"/>
            <rect x="81" y="0" width="30" height="300" rx="2" fill="url(#rG)" filter="url(#shadow)"/>
            <rect x="86" y="0" width="8" height="300" rx="1" fill="rgba(255,255,255,0.07)"/>
        </svg>

        <div class="subtitle">A GayatriFlix Original Event</div>
        <div class="title">THE 19TH CHAPTER</div>
        <div class="date">DROPPING WORLDWIDE SOON</div>
        <button class="btn" onclick="remindMe()">⏰ Set Reminder</button>
    </div>

    <audio id="tudum" src="../Netflix Intro Sound Effect - sound effects.mp3" preload="auto"></audio>

    <script>
        // Auto play the TUDUM sound when the page loads
        window.addEventListener('load', () => {
            const sound = document.getElementById('tudum');
            sound.volume = 0.5;
            setTimeout(() => { sound.play().catch(()=>{}); }, 800);
        });

        function remindMe() {
            const btn = document.querySelector('.btn');
            btn.innerHTML = '✓ Reminder Set';
            btn.style.background = '#46d369';
            btn.style.color = '#fff';
            btn.style.borderColor = '#46d369';
            
            try {
                confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 }, colors: ['#E50914', '#fff', '#46d369'] });
            } catch(e) {}
            
            setTimeout(() => {
                window.location.href = 'teaser.html';
            }, 1000);
        }
    </script>
</body>
</html>
